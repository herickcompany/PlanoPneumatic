<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plano Pneumatic | Base de troca</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="dashboard-layout" data-process-type="Base de troca">
        <aside class="sidebar">
            <div class="brand brand-sidebar"><img src="/logo.png" alt="Plano Pneumatic" /><span>OPERAÇÃO</span></div>
            <nav class="nav"><a class="nav-link" href="/"><span>▦</span> Dashboard</a><a class="nav-link"
                    href="/triagem.html"><span>◎</span> Triagem</a><a class="nav-link"
                    href="/pedido-venda.html"><span>▤</span> Pedidos de venda</a><a class="nav-link active"
                    href="/base-troca.html"><span>↻</span> Base de troca</a><a class="nav-link"
                    href="/garantia.html"><span>✓</span> Garantias</a></nav>
            <div class="sidebar-bottom">
                <div class="profile-mini"><span id="profile-initials">--</span>
                    <div><strong id="profile-name">Carregando</strong><small id="profile-role">Perfil</small></div>
                </div><button id="logout-button" class="logout-button" type="button">Sair <span>↗</span></button>
            </div>
        </aside>
        <div class="dashboard-content process-content">
            <header class="topbar">
                <div>
                    <p id="process-eyebrow" class="eyebrow"></p>
                    <h1 id="process-title"></h1>
                </div><a class="back-link" href="/">← Voltar ao dashboard</a>
            </header>
            <div class="process-intro">
                <p id="process-description" class="muted"></p><span class="process-status">Em cadastro</span>
            </div>
            <form id="process-form" class="process-form">
                <section class="triage-section">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">01 · Identificação</p>
                            <h2>Dados do cliente e item</h2>
                        </div><span class="required-note">* Obrigatório</span>
                    </div>
                    <div class="field-grid"><label>Cliente *<input name="client" required
                                placeholder="Nome ou razão social" /></label><label>Documento<input
                                name="clientDocument" placeholder="CPF ou CNPJ" /></label><label>Produto *<input
                                name="product" required placeholder="Descrição do item" /></label><label>Código do item
                            *<input name="productCode" required placeholder="Código" /></label><label>Quantidade *<input
                                name="quantity" type="number" min="1" value="1" required /></label></div>
                </section>
                <section class="triage-section">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">02 · Avaliação</p>
                            <h2>Motivo e condição da troca</h2>
                        </div>
                    </div>
                    <div id="special-fields" class="field-grid"></div>
                </section>
                <section class="triage-section">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">03 · Observações</p>
                            <h2>Contexto operacional</h2>
                        </div>
                    </div><label>Observações internas<textarea name="notes" rows="4"
                            placeholder="Descreva a ocorrência e a documentação disponível"></textarea></label>
                </section>
                <div class="form-actions">
                    <p id="process-feedback" class="feedback" role="alert"></p><a class="button button-secondary"
                        href="/">Cancelar</a><button class="button button-primary" type="submit"><span
                            id="submit-label">Salvar</span> <span>→</span></button>
                </div>
            </form>
        </div>
    </main>
    <script src="/processo.js" defer></script>
</body>

</html>
