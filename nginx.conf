server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /logo.png {
    try_files /LogoPneumatic.png =404;
  }

  location = /api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /frontend {
    return 301 /frontend/;
  }

  location = /frontend/api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /frontend/api/ {
    rewrite ^/frontend(/api/.*)$ $1 break;
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /frontend/ {
    rewrite ^/frontend/?(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
