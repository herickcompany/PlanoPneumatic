name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: 24

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/plano_pneumatic_test
      MIGRATIONS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/plano_pneumatic_migrations_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/plano_pneumatic_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high
      - name: Varredura de segredos
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 dir /repo --no-banner --redact
      - name: Criar bancos de teste
        run: |
          for database in plano_pneumatic_test plano_pneumatic_migrations_test plano_pneumatic_e2e; do
            psql -h localhost -U postgres -c "CREATE DATABASE $database"
          done
      - name: Testes de API, permissoes, concorrencia e migrations (banco real)
        run: npm test
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - run: docker compose config --quiet
      - run: docker build -f Dockerfile -t planopneumatic-api:${{ github.sha }} .
      - run: docker build -f Dockerfile.frontend --build-arg BUILD_ID=${{ github.sha }} -t planopneumatic-frontend:${{ github.sha }} .
      - run: git diff --check

  # Homologacao: deploy automatico a cada merge na main (ative com a variavel de repositorio STAGING_ENABLED=true).
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy API (homologacao)
        run: npx --yes @railway/cli@3 up --ci --service "$SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_STAGING_API_SERVICE }}
      - name: Deploy frontend (homologacao)
        run: npx --yes @railway/cli@3 up --ci --service "$SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE }}

  # Producao: exige aprovacao do ambiente "production" e usa a CLI oficial da Railway (sem acao de terceiros).
  deploy-production:
    # Roda mesmo quando a homologacao esta desativada (job ignorado), mas nunca se ela falhar.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') }}
    needs: [validate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy API
        run: npx --yes @railway/cli@3 up --ci --service "$SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
      - name: Deploy frontend
        run: npx --yes @railway/cli@3 up --ci --service "$SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_FRONTEND_SERVICE }}
